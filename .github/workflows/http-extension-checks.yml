name: HTTP extension

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  http:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check -p rpi-http
      - run: cargo test --locked -p rpi-http
      - run: cargo clippy --locked -p rpi-http --all-targets --no-deps -- -D warnings
