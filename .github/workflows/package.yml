name: Build agent package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory name
        required: true
        default: blogs
  push:
    tags:
      - '*-v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and checksum package
        env:
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python scripts/build_package.py "${TAG%-v*}" --out dist --tag "$TAG"
          else
            python scripts/build_package.py "$PACKAGE" --out dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: agent-package
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent-package
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG"
