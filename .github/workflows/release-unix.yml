name: Build Unix release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to receive the platform archives
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            platform: linux-x86_64
            archive: rpi-packages-linux-x86_64.tar.gz
          - name: macOS x86_64
            runner: macos-15-intel
            platform: macos-x86_64
            archive: rpi-packages-macos-x86_64.tar.gz
          - name: macOS arm64
            runner: macos-14
            platform: macos-aarch64
            archive: rpi-packages-macos-aarch64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release libraries
        run: cargo build --release --workspace

      - name: Assemble bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          # The extension list is derived from `cargo metadata` filtered by
          # catalog/packages.json, and the tool fails if a catalogued package
          # was not built - so a package can no longer be silently dropped from
          # a release the way the old hardcoded install.sh list allowed.
          cargo run --release -p rpi-package-install -- pack
          test -d "dist/rpi-packages-${{ matrix.platform }}"
          archive="dist/${{ matrix.archive }}"
          test -f "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload archive to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "${{ steps.bundle.outputs.archive }}" --repo "${{ github.repository }}" --clobber
