name: Build portable Web releases

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      RPI_RUSTFS_ENDPOINT:
        required: false
      RPI_RUSTFS_BUCKET:
        required: false
      RPI_RUSTFS_ACCESS_KEY:
        required: false
      RPI_RUSTFS_SECRET_KEY:
        required: false
      RPI_CDN_BASE_URL:
        required: false
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact published source commit
        required: true
        type: string
      tag:
        description: Published rpi-web-vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    # Keep release verification aligned with the pre-merge Web gate.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/rpi-web/frontend/package-lock.json
      - name: Build and verify the production frontend
        working-directory: packages/rpi-web/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e:production
      - uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: packages/rpi-web/assets/
          if-no-files-found: error

  build:
    needs: frontend
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      # Treat compiler warnings as CI failures for every build.
      RUSTFLAGS: '-D warnings'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-release-${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: web-assets
      - name: Embed the verified frontend in both entrypoints
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path.cwd().resolve()
          destination = (root / 'packages/rpi-web/assets').resolve()
          if destination.parent != root / 'packages/rpi-web':
              raise RuntimeError('Frontend destination must stay inside the Web package')
          if destination.exists():
              shutil.rmtree(destination)
          shutil.copytree('web-assets', destination)
          PY
      - name: Build the Web executable and extension
        run: cargo build --release --locked -p rpi-web --bin rpi-web --lib
      - name: Verify the startup page and HTTP listener on this platform
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--format-version', '1', '--locked']))
          binary = Path(metadata['target_directory']) / 'release' / ('rpi-web.exe' if os.name == 'nt' else 'rpi-web')
          subprocess.run([sys.executable, 'packages/rpi-web/scripts/verify-startup.py', '--web', str(binary)], check=True)
          PY
      - name: Package the binary and verified frontend together
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python .github/scripts/web-release.py build \
            --target "$TARGET" --source-ref "$SOURCE_REF" \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --assets web-assets --output dist/web-release
          python .github/scripts/prebuilt-assets.py build \
            --target "$TARGET" --source-ref "$SOURCE_REF" \
            --repository "$GITHUB_REPOSITORY" --bundle-tag unused \
            --tags "[\"$RELEASE_TAG\"]" --packages-only --output dist/web-extension
      - uses: actions/upload-artifact@v4
        with:
          name: rpi-web-bin-${{ matrix.target }}
          path: dist/web-release/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: rpi-web-extension-${{ matrix.target }}
          path: dist/web-extension/
          if-no-files-found: error

  musl-build:
    needs: frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: packages/rpi-web/assets
      - name: Build and verify Web with a native musl compiler
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          docker run --rm \
            -e SOURCE_REF -e RELEASE_TAG -e GITHUB_REPOSITORY \
            -e RUSTFLAGS='-D warnings -C target-feature=-crt-static' \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            rust:alpine sh -ec '
              apk add --no-cache build-base binutils python3 git
              git config --global --add safe.directory /workspace
              cargo build --release --locked -p rpi-web --bin rpi-web --lib
              cargo test --release --locked -p rpi-web -p rpi-http -p rpi-extcore
              cc tools/musl-plugin-loader.c -o target/release/musl-plugin-loader -ldl
              if readelf -d target/release/librpi_web_extension.so | grep -Eq "libc\\.so\\.6|ld-linux"; then
                echo "Web musl extension links glibc" >&2
                exit 1
              fi
              target/release/musl-plugin-loader "$PWD/target/release/librpi_web_extension.so"
              python3 packages/rpi-web/scripts/verify-startup.py --web target/release/rpi-web
              python3 .github/scripts/web-release.py build \
                --target x86_64-unknown-linux-musl --source-ref "$SOURCE_REF" \
                --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
                --assets packages/rpi-web/assets --output dist/web-release
              python3 .github/scripts/prebuilt-assets.py build \
                --target x86_64-unknown-linux-musl --source-ref "$SOURCE_REF" \
                --repository "$GITHUB_REPOSITORY" --bundle-tag unused \
                --tags "[\"$RELEASE_TAG\"]" --packages-only --output dist/web-extension
            '
      - uses: actions/upload-artifact@v4
        with:
          name: rpi-web-bin-x86_64-unknown-linux-musl
          path: dist/web-release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rpi-web-extension-x86_64-unknown-linux-musl
          path: dist/web-extension/
          if-no-files-found: error

  publish:
    needs: [build, musl-build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: rpi-web-bin-*
          path: dist/web-release/
          merge-multiple: true
      - name: Verify every platform and publish the manifest last
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python .github/scripts/web-release.py publish \
            --source-ref "$SOURCE_REF" --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --output dist/web-release
      - uses: actions/download-artifact@v4
        with:
          pattern: rpi-web-extension-*
          path: dist/web-extension/
          merge-multiple: true
      - name: Publish the installable extension and discovery manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python .github/scripts/prebuilt-assets.py publish \
            --source-ref "$SOURCE_REF" --repository "$GITHUB_REPOSITORY" \
            --bundle-tag unused --tags "[\"$RELEASE_TAG\"]" \
            --packages-only --output dist/web-extension
      - name: Optionally mirror Web release files to RustFS
        id: rustfs_mirror
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RPI_RUSTFS_ENDPOINT: ${{ secrets.RPI_RUSTFS_ENDPOINT }}
          RPI_RUSTFS_BUCKET: ${{ secrets.RPI_RUSTFS_BUCKET }}
          RPI_RUSTFS_ACCESS_KEY: ${{ secrets.RPI_RUSTFS_ACCESS_KEY }}
          RPI_RUSTFS_SECRET_KEY: ${{ secrets.RPI_RUSTFS_SECRET_KEY }}
          RPI_CDN_BASE_URL: ${{ secrets.RPI_CDN_BASE_URL }}
        run: |
          python .github/scripts/web-release.py mirror \
            --tag "$RELEASE_TAG" --output dist/web-release
          python .github/scripts/prebuilt-assets.py mirror \
            --tags "[\"$RELEASE_TAG\"]" --packages-only --output dist/web-extension
      - name: Report RustFS mirror failure
        if: steps.rustfs_mirror.outcome == 'failure'
        run: |
          echo "::warning::RustFS/CDN Web mirror failed; GitHub Releases remain canonical."
          echo "- WARNING: RustFS/CDN Web mirror failed; GitHub Releases remain canonical." >> "$GITHUB_STEP_SUMMARY"
