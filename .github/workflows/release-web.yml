name: Build portable Web releases

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      RPI_RUSTFS_ENDPOINT:
        required: false
      RPI_RUSTFS_BUCKET:
        required: false
      RPI_RUSTFS_ACCESS_KEY:
        required: false
      RPI_RUSTFS_SECRET_KEY:
        required: false
      RPI_CDN_BASE_URL:
        required: false
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact published source commit
        required: true
        type: string
      tag:
        description: Published rpi-web-vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    # Keep release verification aligned with the pre-merge Web gate.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/rpi-web/frontend/package-lock.json
      - name: Build and verify the production frontend
        working-directory: packages/rpi-web/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e:production
      - uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: packages/rpi-web/assets/
          if-no-files-found: error

  build:
    needs: frontend
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      # Treat compiler warnings as CI failures for every build.
      RUSTFLAGS: '-D warnings'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-release-${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: web-assets
      - name: Build the Web binary
        run: cargo build --release --locked -p rpi-web --bin rpi-web
      - name: Package the binary and verified frontend together
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python .github/scripts/web-release.py build \
            --target "$TARGET" --source-ref "$SOURCE_REF" \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --assets web-assets --output dist/web-release
      - uses: actions/upload-artifact@v4
        with:
          name: rpi-web-bin-${{ matrix.target }}
          path: dist/web-release/
          if-no-files-found: error

  # Keep the portable musl Web binary, but use the simple binary-only build.
  musl-build:
    needs: frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: packages/rpi-web/assets
      - name: Build and package the Web binary with musl
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          docker run --rm \
            -e SOURCE_REF -e RELEASE_TAG -e GITHUB_REPOSITORY \
            -e RUSTFLAGS='-D warnings -C target-feature=-crt-static' \
            -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=cc \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            rust:alpine sh -ec '
              apk add --no-cache build-base binutils python3 git perl
              git config --global --add safe.directory /workspace
              cargo build --release --locked -p rpi-web --bin rpi-web
              python3 .github/scripts/web-release.py build \
                --target x86_64-unknown-linux-musl --source-ref "$SOURCE_REF" \
                --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
                --assets packages/rpi-web/assets --output dist/web-release
            '
      - uses: actions/upload-artifact@v4
        with:
          name: rpi-web-bin-x86_64-unknown-linux-musl
          path: dist/web-release/
          if-no-files-found: error

  publish:
    needs: [build, musl-build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: rpi-web-bin-*
          path: dist/web-release/
          merge-multiple: true
      - name: Verify every platform and publish the manifest last
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python .github/scripts/web-release.py publish \
            --source-ref "$SOURCE_REF" --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --output dist/web-release
      - name: Optionally mirror Web release files to RustFS
        id: rustfs_mirror
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RPI_RUSTFS_ENDPOINT: ${{ secrets.RPI_RUSTFS_ENDPOINT }}
          RPI_RUSTFS_BUCKET: ${{ secrets.RPI_RUSTFS_BUCKET }}
          RPI_RUSTFS_ACCESS_KEY: ${{ secrets.RPI_RUSTFS_ACCESS_KEY }}
          RPI_RUSTFS_SECRET_KEY: ${{ secrets.RPI_RUSTFS_SECRET_KEY }}
          RPI_CDN_BASE_URL: ${{ secrets.RPI_CDN_BASE_URL }}
        run: |
          python .github/scripts/web-release.py mirror \
            --tag "$RELEASE_TAG" --output dist/web-release
      - name: Report RustFS mirror failure
        if: steps.rustfs_mirror.outcome == 'failure'
        run: |
          echo "::warning::RustFS/CDN Web mirror failed; GitHub Releases remain canonical."
          echo "- WARNING: RustFS/CDN Web mirror failed; GitHub Releases remain canonical." >> "$GITHUB_STEP_SUMMARY"
