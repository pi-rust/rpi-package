version: "3"

tasks:
  default:
    cmds:
      - task --list

  check:
    desc: Check all package crates
    cmds:
      - cargo check --workspace

  test:
    desc: Run all unit and package tests
    cmds:
      - cargo test --workspace

  build:
    desc: Build release cdylibs for this platform
    cmds:
      - cargo build --release --workspace

  install:
    desc: Build and copy all extension cdylibs to the rpi extension directory
    deps: [build]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1

  pack:
    desc: Create a distributable Windows x86_64 extension bundle
    deps: [build]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/pack.ps1

  smoke:
    desc: Load all built packages through the pi-rust extension loader
    deps: [build]
    cmds:
      - cargo test --manifest-path tools/rpi-package-smoke/Cargo.toml -- --ignored --nocapture

  publish-dry-run:
    desc: Verify all 21 extensions can be packaged for crates.io
    cmds:
      - task: test
      - cargo publish --dry-run --allow-dirty -p rpi-mcp-adapter
      - cargo publish --dry-run --allow-dirty -p rpi-web-access
      - cargo publish --dry-run --allow-dirty -p rpi-subagents
      - cargo publish --dry-run --allow-dirty -p rpi-background-tasks
      - cargo publish --dry-run --allow-dirty -p rpi-lens
      - cargo publish --dry-run --allow-dirty -p rpi-todo
      - cargo publish --dry-run --allow-dirty -p rpi-codegraph
      - cargo publish --dry-run --allow-dirty -p rpi-memory
      - cargo publish --dry-run --allow-dirty -p rpi-token-usage
      - cargo publish --dry-run --allow-dirty -p rpi-ask-user
      - cargo publish --dry-run --allow-dirty -p rpi-permissions
      - cargo publish --dry-run --allow-dirty -p rpi-simplify
      - cargo publish --dry-run --allow-dirty -p rpi-search
      - cargo publish --dry-run --allow-dirty -p rpi-goal
      - cargo publish --dry-run --allow-dirty -p rpi-langfuse
      - cargo publish --dry-run --allow-dirty -p rpi-websearch
      - cargo publish --dry-run --allow-dirty -p rpi-webfetch
      - cargo publish --dry-run --allow-dirty -p rpi-firecrawl
      - cargo publish --dry-run --allow-dirty -p rpi-extension-rpc
      - cargo publish --dry-run --allow-dirty -p rpi-im-message
      - cargo publish --dry-run --allow-dirty -p rpi-server

  publish:
    desc: Publish all packages to crates.io
    cmds:
      - task: test
      - cargo publish --allow-dirty -p rpi-mcp-adapter
      - cargo publish --allow-dirty -p rpi-web-access
      - cargo publish --allow-dirty -p rpi-subagents
      - cargo publish --allow-dirty -p rpi-background-tasks
      - cargo publish --allow-dirty -p rpi-lens
      - cargo publish --allow-dirty -p rpi-todo
      - cargo publish --allow-dirty -p rpi-codegraph
      - cargo publish --allow-dirty -p rpi-memory
      - cargo publish --allow-dirty -p rpi-token-usage
      - cargo publish --allow-dirty -p rpi-ask-user
      - cargo publish --allow-dirty -p rpi-permissions
      - cargo publish --allow-dirty -p rpi-simplify
      - cargo publish --allow-dirty -p rpi-search
      - cargo publish --allow-dirty -p rpi-goal
      - cargo publish --allow-dirty -p rpi-langfuse
      - cargo publish --allow-dirty -p rpi-websearch
      - cargo publish --allow-dirty -p rpi-webfetch
      - cargo publish --allow-dirty -p rpi-firecrawl
      - cargo publish --allow-dirty -p rpi-extension-rpc
      - cargo publish --allow-dirty -p rpi-im-message
      - cargo publish --allow-dirty -p rpi-server

  publish-new:
    desc: Publish the packages added after the initial release
    cmds:
      - task: test
      - cargo publish --allow-dirty -p rpi-ask-user
      - cargo publish --allow-dirty -p rpi-permissions
      - cargo publish --allow-dirty -p rpi-simplify
      - cargo publish --allow-dirty -p rpi-search
      - cargo publish --allow-dirty -p rpi-goal
      - cargo publish --allow-dirty -p rpi-websearch
      - cargo publish --allow-dirty -p rpi-webfetch
      - cargo publish --allow-dirty -p rpi-firecrawl
      - cargo publish --allow-dirty -p rpi-extension-rpc
      - cargo publish --allow-dirty -p rpi-im-message

  publish-todo:
    desc: Publish the rpi-todo store compatibility fix
    cmds:
      - cargo test -p rpi-todo
      - cargo publish --allow-dirty -p rpi-todo
