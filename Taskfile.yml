version: "3"

# cdylib / executable naming, so the smoke task can point the artifact-specific
# tests at the files `task build` just produced on any platform.
vars:
  DLL_PREFIX:
    sh: python -c "import sys; print('' if sys.platform=='win32' else 'lib')"
  DLL_SUFFIX:
    sh: python -c "import sys; print({'win32':'.dll','darwin':'.dylib'}.get(sys.platform,'.so'))"
  EXE_SUFFIX:
    sh: python -c "import sys; print('.exe' if sys.platform=='win32' else '')"

tasks:
  default:
    cmds:
      - task --list

  web:build:
    desc: Typecheck and bundle the web workspace, then build the native bridge
    cmds:
      - task: web:frontend:build
      - cargo build -p rpi-web --locked

  web:frontend:build:
    internal: true
    dir: packages/rpi-web/frontend
    cmds: [npm run build]

  web:extension:test:
    desc: Verify the Web extension against an isolated native host (RPI_HOST=path/to/rpi)
    requires:
      vars: [RPI_HOST]
    vars:
      WEB_PLUGIN:
        sh: python -c "import json,subprocess,os; m=json.loads(subprocess.check_output(['cargo','metadata','--no-deps','--format-version','1'])); print(os.path.join(m['target_directory'],'debug','{{.DLL_PREFIX}}rpi_web_extension{{.DLL_SUFFIX}}'))"
    cmds:
      - cargo build -p rpi-web --lib --locked
      - python packages/rpi-web/scripts/verify-extension.py --rpi "{{.RPI_HOST}}" --plugin "{{.WEB_PLUGIN}}"


  web:frontend:test:
    internal: true
    dir: packages/rpi-web/frontend
    cmds:
      - npm run typecheck
      - npm run e2e

  web:test:
    desc: Verify the web bridge and browser workspace
    cmds:
      - cargo test -p rpi-web --lib --locked
      - task: web:frontend:test

  check:
    desc: Check all package crates
    cmds:
      - cargo check --workspace

  test:
    desc: Run all unit and package tests
    cmds:
      - cargo test --workspace

  test-acp:
    desc: Test ACP protocol and streaming (optional native host checks via RPI_TEST_HOST/PLUGIN)
    cmds:
      - cargo test -p rpi-acp
      - cargo build -p rpi-acp --bin rpi-acp-bridge --example fake_rpc --lib
      - python packages/rpi-acp/tests/streaming.py --bridge "{{.ACP_BRIDGE}}"
      - python -m unittest discover -s packages/rpi-acp/tests -v
    vars:
      ACP_BRIDGE:
        sh: python -c "import json,subprocess,os; m=json.loads(subprocess.check_output(['cargo','metadata','--no-deps','--format-version','1'])); print(os.path.join(m['target_directory'],'debug','rpi-acp-bridge'+('.exe' if os.name=='nt' else '')))"

  build:
    desc: Build release cdylibs for this platform
    cmds:
      - cargo build --release --workspace

  install:
    desc: Build and copy the extension cdylibs into the rpi extension directory
    deps: [build]
    cmds:
      - cargo run --release -p rpi-package-install -- install

  install-bundle:
    desc: Install extensions from a bundle archive (ARCHIVE=path/to/archive)
    requires:
      vars: [ARCHIVE]
    cmds:
      - cargo run --release -p rpi-package-install -- bundle --archive "{{.ARCHIVE}}"

  pack:
    desc: Stage a distributable extension bundle under dist/ and archive it
    deps: [build]
    cmds:
      - cargo run --release -p rpi-package-install -- pack

  pack-stage:
    desc: Stage the bundle under dist/ without creating the archive
    deps: [build]
    cmds:
      - cargo run --release -p rpi-package-install -- pack --no-archive

  pack-acp:
    desc: Package the standalone rpi-acp bridge binary for the ACP Registry
    cmds:
      - cargo build --release -p rpi-acp --bin rpi-acp-bridge
      - cargo run --release -p rpi-package-install -- pack-acp

  smoke:
    desc: Load all built packages through the pi-rust extension loader
    deps: [build]
    vars:
      # `task smoke` runs every `--ignored` test, so point the artifact-specific
      # ones at the cdylibs this task just built; otherwise they skip.
      RELEASE:
        sh: python tools/rpi-package-smoke/stage_plugins.py --print-release-dir
      PLUGIN_DIR: "{{.ROOT_DIR}}/target/smoke-plugins"
    cmds:
      - python -m unittest discover -s tools/rpi-package-smoke -p test_stage_plugins.py
      # Stage exactly this workspace's cdylibs so the loaded set depends on the
      # checkout, not on whatever else was built into target/release.
      - python tools/rpi-package-smoke/stage_plugins.py --out "{{.PLUGIN_DIR}}"
      # Single-threaded on purpose: every test here loads plugins into the *same*
      # process, and the host-side registries (MCP connections, status mailbox,
      # todo/goal state) are process-global. Running them concurrently makes one
      # test's shutdown cancel another's in-flight call.
      - cargo test --manifest-path tools/rpi-package-smoke/Cargo.toml -- --ignored --test-threads=1
    env:
      RPI_SMOKE_PLUGIN_DIR: "{{.PLUGIN_DIR}}"
      RPI_TODO_DLL: "{{.RELEASE}}/{{.DLL_PREFIX}}rpi_todo{{.DLL_SUFFIX}}"
      RPI_PLAN_DLL: "{{.RELEASE}}/{{.DLL_PREFIX}}rpi_plan_mode{{.DLL_SUFFIX}}"
      RPI_STATS_DLL: "{{.RELEASE}}/{{.DLL_PREFIX}}rpi_run_stats{{.DLL_SUFFIX}}"
      RPI_VOICE_DLL: "{{.RELEASE}}/{{.DLL_PREFIX}}rpi_voice{{.DLL_SUFFIX}}"
      RPI_VOICE_AUTO_TTS: "off"
      RPI_MCP_DLL: "{{.RELEASE}}/{{.DLL_PREFIX}}rpi_mcp_adapter{{.DLL_SUFFIX}}"
      RPI_FAKE_MCP_SERVER: "{{.RELEASE}}/fake_mcp_server{{.EXE_SUFFIX}}"

  publish-dry-run:
    desc: Verify all extensions can be packaged for crates.io
    cmds:
      - task: test
      - cargo publish --dry-run --allow-dirty -p rpi-mcp-adapter
      - cargo publish --dry-run --allow-dirty -p rpi-subagents
      - cargo publish --dry-run --allow-dirty -p rpi-btw
      - cargo publish --dry-run --allow-dirty -p rpi-lens
      - cargo publish --dry-run --allow-dirty -p rpi-todo
      - cargo publish --dry-run --allow-dirty -p rpi-goal
      - cargo publish --dry-run --allow-dirty -p rpi-plan-mode
      - cargo publish --dry-run --allow-dirty -p rpi-codegraph
      - cargo publish --dry-run --allow-dirty -p rpi-ask-user
      - cargo publish --dry-run --allow-dirty -p rpi-permissions
      - cargo publish --dry-run --allow-dirty -p rpi-langfuse
      - cargo publish --dry-run --allow-dirty -p rpi-websearch
      - cargo publish --dry-run --allow-dirty -p rpi-webfetch
      - cargo publish --dry-run --allow-dirty -p rpi-im-message
      - cargo publish --dry-run --allow-dirty -p rpi-server
      - cargo publish --dry-run --allow-dirty -p rpi-acp
      - cargo publish --dry-run --allow-dirty -p rpi-permission-gate
      - cargo publish --dry-run --allow-dirty -p rpi-voice
      - cargo publish --dry-run --allow-dirty -p rpi-run-stats

  publish:
    desc: Publish all packages to crates.io
    cmds:
      - task: test
      - cargo publish --allow-dirty -p rpi-mcp-adapter
      - cargo publish --allow-dirty -p rpi-subagents
      - cargo publish --allow-dirty -p rpi-btw
      - cargo publish --allow-dirty -p rpi-lens
      - cargo publish --allow-dirty -p rpi-todo
      - cargo publish --allow-dirty -p rpi-goal
      - cargo publish --allow-dirty -p rpi-plan-mode
      - cargo publish --allow-dirty -p rpi-codegraph
      - cargo publish --allow-dirty -p rpi-ask-user
      - cargo publish --allow-dirty -p rpi-permissions
      - cargo publish --allow-dirty -p rpi-langfuse
      - cargo publish --allow-dirty -p rpi-websearch
      - cargo publish --allow-dirty -p rpi-webfetch
      - cargo publish --allow-dirty -p rpi-im-message
      - cargo publish --allow-dirty -p rpi-server
      - cargo publish --allow-dirty -p rpi-acp
      - cargo publish --allow-dirty -p rpi-permission-gate
      - cargo publish --allow-dirty -p rpi-voice
      - cargo publish --allow-dirty -p rpi-run-stats

  publish-new:
    desc: Publish the packages added after the initial release
    cmds:
      - task: test
      - cargo publish --allow-dirty -p rpi-ask-user
      - cargo publish --allow-dirty -p rpi-plan-mode
      - cargo publish --allow-dirty -p rpi-permissions
      - cargo publish --allow-dirty -p rpi-websearch
      - cargo publish --allow-dirty -p rpi-webfetch
      - cargo publish --allow-dirty -p rpi-im-message

  publish-todo:
    desc: Publish the rpi-todo store compatibility fix
    cmds:
      - cargo test -p rpi-todo
      - cargo publish --allow-dirty -p rpi-todo

  publish-voice:
    desc: Publish rpi-voice only
    cmds:
      - cargo test -p rpi-voice
      - cargo publish --allow-dirty -p rpi-voice

  publish-im-message:
    desc: Publish rpi-im-message with Feishu session commands and tool progress
    cmds:
      - cargo test -p rpi-im-message
      - cargo publish --allow-dirty -p rpi-im-message
