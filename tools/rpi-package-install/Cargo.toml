[package]
name = "rpi-package-install"
version = "0.0.0"
edition = "2021"
publish = false
description = "Cross-platform installer/packager for the rpi extension cdylibs"

[[bin]]
name = "rpi-package-install"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
