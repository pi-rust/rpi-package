[package]
name = "rpi-http-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "HTTP/SSE/WebSocket adapter for an existing multi-project node owner"

[lints.rust]
unsafe_code = "warn"
[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
rpi-http-runtime = { path = "../rpi-http-runtime", version = "0.1.0" }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs"] }
rpi-node-core = { path = "../rpi-node-core", version = "0.1.0" }
rpi-node-api = { path = "../rpi-node-api", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", features = ["sink"] }
async-stream = "0.3"
sha2 = "0.10"
subtle = "2"
url = "2"
getrandom = "0.3"

[dev-dependencies]
socket2 = "0.6"
tempfile = "3"
