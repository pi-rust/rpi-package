[package]
name = "rpi-goal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Codex-style goal mode for the rpi Rust agent: a persistent, context-injected goal the model keeps advancing turn over turn"
readme = "README.md"
keywords = ["rpi", "goal", "objective", "autonomous", "plugin"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
