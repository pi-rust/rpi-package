[package]
name = "rpi-goal"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Codex-style goal mode for the rpi Rust agent: one session objective that keeps working after the agent settles, until an explicit completion, blocker, wait, or limit"
readme = "README.md"
keywords = ["rpi", "goal", "objective", "autonomous", "plugin"]
categories = ["development-tools"]

[package.metadata.rpi.prebuilt]
supported-targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-musl",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
