[package]
name = "rpi-mcp-server"
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MCP server adapter exposing rpi agent capabilities"
readme = "README.md"
keywords = ["rpi", "mcp", "agent", "stdio"]

[package.metadata.rpi.prebuilt]
supported-targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rpi-mcp-bridge"
path = "src/main.rs"

[dependencies]
rpi-extcore = { path = "../rpi-extcore", version = "0.2.16" }
rpi-plugin-sdk = { workspace = true, features = ["stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "io-std", "macros", "net", "signal"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rpi-extcore = { path = "../rpi-extcore", version = "0.2.16", features = ["test-support"] }
reqwest = { workspace = true, features = ["json", "stream"] }
tokio-tungstenite = "0.29"
