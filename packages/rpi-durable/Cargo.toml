[package]
name = "rpi-durable"
version = "0.3.4"
publish = false
# Archived: durable workflow support is now provided by the native host.
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Durable, resumable workflow checkpoints for the rpi Rust agent"
readme = "README.md"
keywords = ["rpi", "durable", "checkpoint", "workflow", "plugin"]
categories = ["development-tools"]

[package.metadata.rpi.prebuilt]
supported-targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = { workspace = true }
rpi-durable-core = { path = "../rpi-durable-core", version = "0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
