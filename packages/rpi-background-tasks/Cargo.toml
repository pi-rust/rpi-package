[package]
name = "rpi-background-tasks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Background shell jobs with a jobs inspector for the rpi Rust agent"
readme = "README.md"
keywords = ["rpi", "background", "jobs", "agent", "plugin"]
categories = ["development-tools"]

[package.metadata.rpi.prebuilt]
supported-targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = { version = "=0.3.20", features = ["process"] }
serde_json = { workspace = true }

