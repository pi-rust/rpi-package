[package]
name = "rpi-edit-diagnostics"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Compiler-style edit tool for the rpi agent: exact matching plus copyable diagnostics"
readme = "README.md"
keywords = ["rpi", "edit", "diagnostics", "plugin"]
categories = ["development-tools"]

[package.metadata.rpi.prebuilt]
supported-targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = "0.2"
rpi-plugin-sdk = { workspace = true }
serde_json = { workspace = true }
similar = { version = "2", features = ["text"] }
unicode-normalization = "0.1"
