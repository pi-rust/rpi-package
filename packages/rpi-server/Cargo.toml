[package]
name = "rpi-server"
version = "0.3.11"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "TCP JSONL server for rpi with streaming subscriptions"
readme = "README.md"
keywords = ["rpi", "rpc", "tcp", "server", "streaming"]

[package.metadata.rpi.prebuilt]
supported-targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "io-std", "macros", "net"] }
async-trait = "0.1"
tokio-tungstenite = "0.29"
futures-util = "0.3"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.13"
# TLS client support is only needed by the wss test; feature merge keeps the
# published library free of tungstenite's TLS code paths.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
