[package]
name = "rpi-providers"
version = "0.1.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Unified DeepSeek, OpenRouter, llama.cpp, proxy and Antigravity provider extension for rpi"
readme = "README.md"

# Publish native archives alongside the crates.io package.
[package.metadata.rpi]
prebuilt = true

[lib]
crate-type = ["cdylib", "rlib"]

# Keep provider transport and lifecycle handling on the same published SDK.
# Unrelated extensions retain their independently pinned SDK versions.
[dependencies]
rpi-ai = { version = "=0.8.3", features = ["providers"] }
rpi-plugin-sdk = { version = "=0.8.3", features = ["provider"] }
async-trait.workspace = true
serde.workspace = true
# Ordered JSON maps: the Antigravity transcript and metadata rules depend on insertion order.
serde_json = { workspace = true, features = ["preserve_order"] }
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "net", "io-util", "fs", "process"] }
# Antigravity module: OAuth PKCE, SSE decoding, schema rules and redaction. All are already
# in the workspace lock through the host SDK; these are direct, additive edges.
base64 = "0.22"
encoding_rs = "0.8"
getrandom = "0.2"
indexmap = "2"
regex = "1"
sha2 = "0.10"
tokio-util = "0.7"
url = "2"

[dev-dependencies]
rpi-extensions = { version = "=0.8.3" }
tokio = { workspace = true, features = ["macros", "net", "io-util"] }
tempfile = "3"
