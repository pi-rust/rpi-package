[package]
name = "rpi-providers"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Unified DeepSeek, OpenRouter, llama.cpp and proxy provider extension for rpi"
readme = "README.md"

# Publish native archives alongside the crates.io package.
[package.metadata.rpi]
prebuilt = true

[lib]
crate-type = ["cdylib", "rlib"]

# SDK 0.6.3 publishes the optional provider bridge and matching host API.
# Keep all three dependencies on the same released version. Do not change
# the SDK used by unrelated extensions in this workspace.
[dependencies]
rpi-ai = { version = "=0.6.3", features = ["providers"] }
rpi-plugin-sdk = { version = "=0.6.3", features = ["provider"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "net", "io-util", "fs", "process"] }

[dev-dependencies]
rpi-extensions = { version = "=0.6.3" }
tokio = { workspace = true, features = ["macros", "net", "io-util"] }
tempfile = "3"
