[package]
name = "rpi-acp"
version = "0.1.6"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ACP agent server for rpi"
readme = "README.md"
keywords = ["rpi", "acp", "agent-protocol", "zed", "stdio"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
# Standalone ACP bridge: same server as the extension, but it owns its own
# stdin/stdout, so an ACP client can launch it without any `rpi` host changes.
# Named `-bridge` (not `rpi-acp`) so its debug-info stem does not collide with
# the `rpi_acp` cdylib in the same package.
name = "rpi-acp-bridge"
path = "src/main.rs"

[dependencies]
rpi-plugin-sdk = { version = "0.3.20", features = ["stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "process",
    "io-util",
    "io-std",
    "macros",
    "net",
] }
