[package]
name = "rpi-acp"
version = "0.1.20"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ACP agent server for rpi"
readme = "README.md"
keywords = ["rpi", "acp", "agent-protocol", "zed", "stdio"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
# Standalone ACP bridge: same server as the extension, but it owns its own
# stdin/stdout, so an ACP client can launch it without any `rpi` host changes.
# Named `-bridge` (not `rpi-acp`) so its debug-info stem does not collide with
# the `rpi_acp` cdylib in the same package.
name = "rpi-acp-bridge"
path = "src/main.rs"

[dependencies]
rpi-extcore = { path = "../rpi-extcore", version = "0.1.5" }
rpi-plugin-sdk = { workspace = true, features = ["stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
sha2.workspace = true
url = "2"
axum = { version = "0.8.9", features = ["ws", "http2"] }
futures-util = { version = "0.3", features = ["sink"] }
subtle = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "process",
    "io-util",
    "io-std",
    "macros",
    "net",
    "signal",
] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["http2", "json"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
rpi-extcore = { path = "../rpi-extcore", version = "0.1.5", features = ["test-support"] }
