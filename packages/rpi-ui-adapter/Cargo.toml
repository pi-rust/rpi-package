[package]
name = "rpi-ui-adapter"
version = "0.1.3"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "UI adapters for rpi ACP agents, starting with Open WebUI"
readme = "README.md"
keywords = ["rpi", "acp", "openwebui", "ui", "adapter"]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[package.metadata.rpi.prebuilt]
supported-targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "process", "io-util", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3", features = ["sink"] }
reqwest.workspace = true
url.workspace = true
uuid = { version = "1", features = ["v4"] }
