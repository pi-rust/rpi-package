[package]
name = "rpi-web"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Project and chat workspace for the native rpi RPC host"
readme = "README.md"
keywords = ["rpi", "agent", "web", "workspace"]
include = [
    "/src/**", "/assets/**", "/scripts/**", "/README.md", "/CHANGELOG.md",
    "/frontend/src/**", "/frontend/public/**", "/frontend/e2e/**",
    "/frontend/*.json", "/frontend/*.ts", "/frontend/index.html",
]

[dependencies]
axum = "0.8.9"
futures-util = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "net", "fs"] }
tower-http = { version = "0.6.11", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
subtle = "2"
