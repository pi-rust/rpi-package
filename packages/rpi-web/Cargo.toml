[package]
name = "rpi-web"
version = "0.1.47"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Project and chat workspace for the native rpi RPC host"
readme = "README.md"
keywords = ["rpi", "agent", "web", "workspace"]
include = [
    "/src/**", "/assets/**", "/scripts/**", "/build.rs", "/README.md", "/CHANGELOG.md",
    "/frontend/src/**", "/frontend/public/**", "/frontend/e2e/**",
    "/frontend/*.json", "/frontend/*.ts", "/frontend/index.html",
]

[package.metadata.rpi.prebuilt]
supported-targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[lib]
name = "rpi_web_extension"
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-extcore = { path = "../rpi-extcore", version = "0.2.11" }
rpi-http = { path = "../rpi-http", version = "0.1.19" }
rpi-plugin-sdk.workspace = true
axum = "0.8.9"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "net", "fs", "signal"] }
tower-http = { version = "0.6.11", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
