<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远程访问</title>
<style>
:root{color-scheme:light dark;--bg:#faf9f6;--card:#fff;--fg:#262722;--muted:#777970;--line:#e6e7df;--accent:#54794d;font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--bg)}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:880px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted)}h1{font-size:27px;font-weight:600;letter-spacing:-.04em;margin:4px 0 8px}p{margin:0;color:var(--muted)}.badge{white-space:nowrap;border:1px solid var(--line);border-radius:100px;padding:5px 12px;font-size:12px}.badge[data-on=true]{color:var(--accent)}.card{border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden}.control{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:25px}h2{font-size:16px;margin:0 0 5px;font-weight:600}.switch{flex-shrink:0;width:48px;height:28px;border:0;border-radius:20px;background:#b3b6ac;padding:3px;cursor:pointer}.switch:after{content:"";display:block;width:22px;height:22px;border-radius:50%;background:white;box-shadow:0 1px 3px #0002;transition:transform .15s}.switch[aria-checked=true]{background:var(--accent)}.switch[aria-checked=true]:after{transform:translateX(20px)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.details{padding:0 25px 23px;display:grid;gap:13px}.row{display:grid;grid-template-columns:100px 1fr;gap:16px;border-top:1px solid var(--line);padding-top:13px}.label{color:var(--muted);font-size:12px}.value{font-size:13px;word-break:break-word}input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:9px 12px;font:12px ui-monospace,monospace}.footnote{margin:18px 3px;font-size:12px}.message{padding:12px 16px;border-radius:9px;margin-top:14px;color:var(--muted);border:1px solid var(--line)}.error{color:#ad4038}.retry{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);padding:7px 14px;margin-top:12px;cursor:pointer}[hidden]{display:none!important}@media(max-width:540px){body{padding:16px}header{gap:12px}h1{font-size:23px}.control{padding:20px}.details{padding:0 20px 20px}.row{grid-template-columns:75px 1fr;gap:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.configuration{margin-top:18px;padding:22px 25px}.configuration summary{font-weight:600;cursor:pointer}.configuration form{display:grid;gap:15px;margin-top:18px}.configuration label{display:grid;gap:6px;font-size:12px;color:var(--muted)}.configuration .fields{display:grid;grid-template-columns:2fr 1fr;gap:16px}.configuration .hint{font-size:12px}.configuration button{justify-self:start;margin:0}.configuration input{font:13px system-ui,sans-serif}@media(max-width:540px){.configuration{padding:18px 20px}.configuration .fields{grid-template-columns:1fr}}
</style></head><body>
<header><div><div class="eyebrow">NODE / REMOTE ACCESS</div><h1>让工作跨设备继续</h1><p>手机、浏览器和其他节点，连接同一份工作空间。</p></div><span class="badge" id="badge" role="status">连接中</span></header>
<section class="card" aria-label="远程访问设置"><div class="control"><div><h2>允许远程访问</h2><p id="description">正在读取节点状态…</p></div><button id="toggle" class="switch" role="switch" aria-label="允许远程访问" aria-checked="false" disabled></button></div><div class="details"><div class="row"><span class="label">服务状态</span><span class="value" id="status">—</span></div><div class="row"><span class="label">访问地址</span><input id="address" readonly aria-label="访问地址" placeholder="服务启用后显示"></div><div class="row"><span class="label">连接方式</span><span class="value">使用节点密码登录；模型凭据保留在执行节点。</span></div></div></section>
<details id="configuration" class="card configuration" hidden><summary>连接设置</summary><form id="config-form"><p class="hint">保存在当前节点，下次启动生效。显式启动参数优先；留空的分享地址由节点自动选择。</p><div class="fields"><label>监听 IP<input id="bind" required placeholder="0.0.0.0 或 127.0.0.1" aria-label="监听 IP"></label><label>监听端口<input id="listen-port" type="number" min="0" max="65535" required aria-label="监听端口"></label></div><label>分享地址<input id="public-url" type="url" placeholder="https://node.example.com/" aria-label="分享地址"></label><label>节点新密码<input id="new-password" type="password" autocomplete="new-password" placeholder="留空保留现有密码" aria-label="节点新密码"></label><button id="save" class="retry" type="button">保存，下次启动生效</button></form></details>
<div id="message" class="message" role="alert" hidden></div><button id="retry" class="retry" hidden>重新读取</button><p class="footnote">关闭远程访问不会停止本机任务，也不影响连接其他节点。修改连接设置后重新打开宿主应用即可生效。</p>
<script>
(()=>{'use strict';let port,sequence=0,busy=false,dirty=false,latest=null;const pending=new Map(),$=id=>document.getElementById(id);
function call(action,args={}){if(!port)return Promise.reject(new Error('组件通信尚未建立'));return new Promise((resolve,reject)=>{const id=String(++sequence),timer=setTimeout(()=>{pending.delete(id);reject(new Error('请求超时，请重新读取状态'))},10000);pending.set(id,{resolve,reject,timer});port.postMessage({type:'call',id,action,arguments:args})})}
function message(text,error=false){$('message').hidden=!text;$('message').textContent=text||'';$('message').className='message'+(error?' error':'')}
function render(s){latest=s;$('badge').textContent=s.listening?(s.enabled?'正在共享':'已关闭'):'未启动';$('badge').dataset.on=String(s.listening&&s.enabled);$('toggle').setAttribute('aria-checked',String(s.enabled));$('toggle').disabled=busy||!s.listening||!s.canConfigure;$('description').textContent=s.canConfigure?'允许其他设备访问当前节点的项目、会话和任务。':'在该节点本机管理远程访问。';$('status').textContent=s.status||'状态未知';$('address').value=s.enabled?(s.publicUrl||s.appUrl||s.address||''):'';$('configuration').hidden=!s.canConfigure||!s.configuration;if(s.configuration&&!dirty){$('bind').value=s.configuration.bind;$('listen-port').value=s.configuration.port;$('public-url').value=s.configuration.publicUrl||''}if(!dirty||s.warning)message(s.warning||(s.restartRequired?'设置已保存，下次启动生效。当前连接和任务继续运行。':''));$('retry').hidden=true}
async function refresh(){if(busy)return;try{render(await call('status'))}catch(e){message(e.message,true);$('retry').hidden=false}}
$('config-form').oninput=()=>{dirty=true;message('')};
$('config-form').onsubmit=e=>e.preventDefault();
$('save').onclick=async()=>{if(busy||!latest?.canConfigure||!$('config-form').reportValidity())return;const value=Number($('listen-port').value);if(!Number.isInteger(value)||value<0||value>65535){message('请输入 0 到 65535 的端口，0 表示自动分配。',true);return}const args={configuration:{bind:$('bind').value.trim(),port:value,publicUrl:$('public-url').value.trim()}};if($('new-password').value)args.newPassword=$('new-password').value;busy=true;$('save').disabled=true;$('toggle').disabled=true;try{const snapshot=await call('configure',args);dirty=false;$('new-password').value='';render(snapshot)}catch(e){message(e.message,true)}finally{busy=false;$('save').disabled=false;if(latest)$('toggle').disabled=!latest.listening||!latest.canConfigure}};
$('toggle').onclick=async()=>{if(!latest||busy)return;busy=true;$('toggle').disabled=true;try{render(await call('set-enabled',{enabled:!latest.enabled}))}catch(e){message(e.message,true);$('retry').hidden=false}finally{busy=false;if(latest)$('toggle').disabled=!latest.listening||!latest.canConfigure}};$('retry').onclick=refresh;
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='rpi-component-init'||e.data.protocol!==1||port||!e.ports[0])return;port=e.ports[0];port.onmessage=e=>{const m=e.data;if(m.type==='result'){const p=pending.get(m.id);if(!p)return;clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(new Error(m.error)):p.resolve(m.value)}else if(m.type==='theme'&&m.values){for(const [key,value]of Object.entries(m.values))if(['--bg','--card','--fg','--muted','--line','--accent'].includes(key)&&typeof value==='string')document.documentElement.style.setProperty(key,value)}};port.start();refresh()});parent.postMessage({type:'rpi-component-ready',protocol:1},'*');setInterval(()=>{if(!document.hidden)refresh()},5000);
})();
</script></body></html>
