[package]
name = "rpi-http-extension"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native rpi plugin entry point for the API-only HTTP/SSE service"
autobins = false

[[bin]]
name = "rpi-http-service"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.rpi.prebuilt]
supported-targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-apple-darwin", "aarch64-apple-darwin"]

[dependencies]
rpi-plugin-sdk.workspace = true
rpi-http = { path = "../rpi-http", version = "0.1.19" }
axum = "0.8.9"
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
