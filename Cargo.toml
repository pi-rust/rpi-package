[workspace]
members = [
    "packages/rpi-mcp-adapter",
    "packages/rpi-web-access",
    "packages/rpi-subagents",
    "packages/rpi-background-tasks",
    "packages/rpi-lens",
    "packages/rpi-todo",
    "packages/rpi-codegraph",
    "packages/rpi-memory",
    "packages/rpi-token-usage",
    "packages/rpi-ask-user",
    "packages/rpi-permissions",
    "packages/rpi-simplify",
    "packages/rpi-search",
    "packages/rpi-goal",
    "packages/rpi-websearch",
    "packages/rpi-webfetch",
    "packages/rpi-firecrawl",
    "packages/rpi-extension-rpc",
    "packages/rpi-im-message",
    "packages/rpi-server",
    "packages/rpi-langfuse",
]
exclude = ["tools/rpi-package-smoke"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.78"
license = "MIT"
authors = ["BigFish <bigfish1913@gmail.com>"]
repository = "https://github.com/pi-rust/rpi-package"

[workspace.dependencies]
# Build the packages against the LOCAL pi-rust SDK so they track the current ABI
# (EventTag::BeforeTuiStart, the v3 declare ext block, ...). The smoke tool
# already path-depends on the same crates.
rpi-plugin-sdk = { version = "0.1.26", path = "../pi-rust/crates/rpi-plugin-sdk" }
feishu-sdk = { version = "0.1.2", default-features = false, features = ["websocket"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
wait-timeout = "0.2"
async-trait = "0.1"

[profile.release]
lto = "thin"
strip = "symbols"
