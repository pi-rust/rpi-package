[workspace]
# cargo update may normalize the lockfile before versions are generated.
allow_dirty = true
dependencies_update = false
semver_check = true
release_always = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"

[[package]]
name = "rpi-package-install"
release = false
publish = false

[[package]]
name = "rpi-web"
# Release builds generate the ignored assets/ bundle before cargo publish.
publish_allow_dirty = true

# Durable workflow state is now a native-host capability. Keep the archived
# crates in the workspace for source/tests, but never version or publish them.
[[package]]
name = "rpi-durable"
release = false
publish = false

[[package]]
name = "rpi-durable-core"
release = false
publish = false
